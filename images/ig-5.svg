  <!-- Houses (top-down) -->
  <g>
    <rect x="280" y="280" width="60" height="50" fill="#3A4248"/>
    <polygon points="280,280 310,260 340,280" fill="#5C4A38"/>
    <rect x="350" y="300" width="50" height="40" fill="#E0D4BE"/>
    <polygon points="350,300 375,285 400,300" fill="#5C4A38"/>
    <rect x="420" y="280" width="70" height="55" fill="#2A3036"/>
    <polygon points="420,280 455,260 490,280" fill="#3A2F22"/>
    <rect x="510" y="320" width="60" height="40" fill="#E0D4BE"/>
    <polygon points="510,320 540,305 570,320" fill="#5C4A38"/>
    <rect x="280" y="500" width="55" height="45" fill="#3A4248"/>
    <polygon points="280,500 307,485 335,500" fill="#5C4A38"/>
    <rect x="360" y="520" width="60" height="45" fill="#E0D4BE"/>
    <polygon points="360,520 390,505 420,520" fill="#5C4A38"/>
    <rect x="440" y="500" width="50" height="40" fill="#2A3036"/>
