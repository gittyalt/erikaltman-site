<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" preserveAspectRatio="xMidYMid slice">
  <rect width="800" height="800" fill="#5C6E5A"/>
  <!-- Tree texture -->
  <g fill="#3F4E3D">
    <circle cx="60" cy="80" r="40"/>
    <circle cx="140" cy="60" r="35"/>
    <circle cx="220" cy="100" r="38"/>
    <circle cx="320" cy="70" r="42"/>
    <circle cx="100" cy="200" r="38"/>
    <circle cx="180" cy="180" r="35"/>
    <circle cx="60" cy="300" r="40"/>
    <circle cx="650" cy="80" r="40"/>
    <circle cx="720" cy="120" r="38"/>
