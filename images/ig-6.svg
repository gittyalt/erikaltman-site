<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" preserveAspectRatio="xMidYMid slice">
  <rect width="800" height="500" fill="#3A4248"/>
  <rect y="500" width="800" height="300" fill="#C4936A"/>
  <!-- Pendant lights -->
  <line x1="200" y1="0" x2="200" y2="100" stroke="#1F2428" stroke-width="2"/>
  <line x1="400" y1="0" x2="400" y2="80" stroke="#1F2428" stroke-width="2"/>
  <line x1="600" y1="0" x2="600" y2="120" stroke="#1F2428" stroke-width="2"/>
  <ellipse cx="200" cy="130" rx="35" ry="40" fill="#E8B872"/>
  <ellipse cx="400" cy="110" rx="35" ry="40" fill="#E8B872"/>
  <ellipse cx="600" cy="150" rx="35" ry="40" fill="#E8B872"/>
  <!-- Light glow -->
  <ellipse cx="200" cy="180" rx="120" ry="80" fill="#E8B872" opacity="0.15"/>
  <ellipse cx="400" cy="160" rx="120" ry="80" fill="#E8B872" opacity="0.15"/>
  <ellipse cx="600" cy="200" rx="120" ry="80" fill="#E8B872" opacity="0.15"/>
  <!-- Table -->
  <ellipse cx="400" cy="540" rx="320" ry="40" fill="#5C4A38"/>
  <rect x="80" y="540" width="640" height="120" fill="#5C4A38"/>
  <ellipse cx="400" cy="660" rx="320" ry="40" fill="#3A2F22"/>
  <!-- Plates -->
  <ellipse cx="200" cy="540" rx="40" ry="10" fill="#F7F2E8"/>
  <ellipse cx="400" cy="535" rx="42" ry="11" fill="#F7F2E8"/>
  <ellipse cx="600" cy="540" rx="40" ry="10" fill="#F7F2E8"/>
  <!-- Wine glasses -->
  <path d="M 250 480 L 260 510 L 270 480 Z" fill="#B05A3C" opacity="0.7"/>
  <line x1="260" y1="510" x2="260" y2="535" stroke="#1F2428" stroke-width="1.5"/>
  <path d="M 460 475 L 470 505 L 480 475 Z" fill="#B05A3C" opacity="0.7"/>
  <line x1="470" y1="505" x2="470" y2="532" stroke="#1F2428" stroke-width="1.5"/>
  <path d="M 660 480 L 670 510 L 680 480 Z" fill="#B05A3C" opacity="0.7"/>
  <line x1="670" y1="510" x2="670" y2="535" stroke="#1F2428" stroke-width="1.5"/>
  <!-- Centerpiece -->
  <ellipse cx="400" cy="500" rx="50" ry="12" fill="#455444"/>
  <circle cx="380" cy="480" r="6" fill="#B05A3C"/>
  <circle cx="400" cy="475" r="7" fill="#B05A3C"/>
  <circle cx="420" cy="478" r="6" fill="#B05A3C"/>
  <circle cx="390" cy="485" r="5" fill="#E8B872"/>
  <circle cx="410" cy="487" r="5" fill="#E8B872"/>
</svg>