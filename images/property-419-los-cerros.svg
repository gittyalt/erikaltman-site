<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" preserveAspectRatio="xMidYMid slice">
<defs><linearGradient id="lc2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#C8D8B8"/><stop offset="1" stop-color="#E0E8D0"/></linearGradient></defs>
<rect width="1200" height="900" fill="url(#lc2)"/>
<ellipse cx="100" cy="320" rx="180" ry="240" fill="#3F4E3D" opacity="0.7"/>
<ellipse cx="1100" cy="340" rx="200" ry="260" fill="#3F4E3D" opacity="0.7"/>
<rect y="700" width="1200" height="200" fill="#7A8E6A"/>
<!-- Updated mid-century ranch -->
<rect x="200" y="500" width="800" height="220" fill="#E5D8C0"/>
<polygon points="180,500 200,460 1000,460 1020,500 180,500" fill="#3A2F22"/>
<!-- Modern flat roof addition on right -->
<rect x="780" y="440" width="240" height="80" fill="#1F2428"/>
<rect x="760" y="430" width="280" height="14" fill="#0F1418"/>
<!-- Floor to ceiling glass -->
<rect x="240" y="540" width="320" height="160" fill="#7B8590" opacity="0.8"/>
<g stroke="#1F2428" stroke-width="2">
<line x1="320" y1="540" x2="320" y2="700"/>
<line x1="400" y1="540" x2="400" y2="700"/>
<line x1="480" y1="540" x2="480" y2="700"/>
</g>
<!-- Front door with sidelight -->
<rect x="600" y="560" width="80" height="160" fill="#B05A3C"/>
<rect x="680" y="560" width="20" height="160" fill="#E8B872" opacity="0.6"/>
<!-- Updated wing windows -->
<rect x="800" y="460" width="180" height="60" fill="#E8B872" opacity="0.6"/>
<rect x="800" y="540" width="180" height="160" fill="#7B8590" opacity="0.8"/>
<g stroke="#1F2428" stroke-width="2">
<line x1="890" y1="540" x2="890" y2="700"/>
</g>
<!-- Wood accent panel -->
<rect x="720" y="540" width="60" height="160" fill="#8B6F52"/>
<!-- Modern walkway -->
<g fill="#C8BFA8">
<rect x="580" y="740" width="60" height="20"/>
<rect x="560" y="770" width="100" height="20"/>
<rect x="540" y="800" width="140" height="20"/>
<rect x="520" y="830" width="180" height="30"/>
</g>
<!-- Landscape -->
<ellipse cx="160" cy="760" rx="80" ry="30" fill="#5C6E5A"/>
<ellipse cx="1040" cy="760" rx="80" ry="30" fill="#5C6E5A"/>
<rect x="360" y="730" width="30" height="60" fill="#5C4A38"/>
<ellipse cx="375" cy="710" rx="40" ry="50" fill="#3F4E3D"/>
</svg>